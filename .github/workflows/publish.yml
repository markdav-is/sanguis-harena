name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish.yml'
      - '.github/head-tags.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wikidown
        run: curl -fsSL https://wikidown.org/install.sh | sh

      - name: Export site to static HTML
        run: |
          export PATH="$HOME/.wikidown/bin:$PATH"
          wikidown export-html --output ./_site \
            --base-url / \
            --title "A Gladiatorial Card Game" \
            --clean --root docs
          echo "sanguisetharena.com" > ./_site/CNAME
          cp ./_site/Home.html ./_site/index.html

      - name: Inject head tags (social preview + favicon)
        run: |
          python3 << 'PYEOF'
          import glob, re
          tags = open('.github/head-tags.html').read()
          for f in glob.glob('./_site/*.html'):
              s = open(f).read()
              if 'my-og-tags' in s:
                  continue
              # strip wikidown's own og/twitter tags so ours are authoritative
              s = re.sub(r'<meta[^>]*property="og:[^"]*"[^>]*>\s*', '', s)
              s = re.sub(r'<meta[^>]*name="twitter:[^"]*"[^>]*>\s*', '', s)
              s = s.replace('</head>', '<!-- my-og-tags -->\n' + tags + '\n</head>', 1)
              open(f, 'w').write(s)
              print('injected into', f)
          PYEOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deploy
        uses: actions/deploy-pages@v5
